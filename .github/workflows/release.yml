name: build-and-release

# Сборка под все архитектуры Keenetic и публикация релиза по тегу v*.
# Ручной запуск (workflow_dispatch) собирает и выкладывает артефакты в run,
# релиз создаётся только на тег.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cross toolchains
        run: |
          sudo apt-get update
          # libc6-dev-*-cross обязательны: без них кросс-gcc не находит
          # bits/libc-header-start.h (--no-install-recommends их не тянет).
          sudo apt-get install -y \
            build-essential curl perl ca-certificates \
            gcc-mipsel-linux-gnu gcc-mips-linux-gnu \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            libc6-dev-mipsel-cross libc6-dev-mips-cross \
            libc6-dev-arm64-cross libc6-dev-armhf-cross

      - name: Verify compilers
        run: |
          set -e
          for c in mipsel-linux-gnu-gcc mips-linux-gnu-gcc aarch64-linux-gnu-gcc arm-linux-gnueabihf-gcc gcc; do
            printf '%-30s ' "$c"
            command -v "$c" || { echo "MISSING"; exit 1; }
            echo 'int main(void){return 0;}' | "$c" -x c - -o /dev/null \
              || { echo "  нет libc-dev для $c"; exit 1; }
          done
          echo "все компиляторы собирают тривиальный файл"

      - name: Build (all arches)
        run: |
          set -o pipefail
          bash tools/build-arch.sh all 2>&1 | tee build-full.log

      - name: Package .ipk
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [ -z "$VER" ] || [ "$VER" = "$GITHUB_REF_NAME" ]; then VER="1.0"; fi
          cp packaging/config.toml.example dist/config.toml
          sh packaging/make-ipk.sh --version "$VER" 2>&1 | tee -a build-full.log

      - name: Checksums
        run: |
          cd dist
          sha256sum ./teleproxy.* ./teleproxy-keenetic_*.ipk > SHA256SUMS
          cat SHA256SUMS

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build-full.log
            /home/runner/tp-build/build-*.log
          if-no-files-found: warn

      - name: Show build errors
        if: always()
        run: |
          shopt -s nullglob
          for f in /home/runner/tp-build/build-*.log; do
            echo "===== $f ====="
            grep -nE 'ОШИБКА|error:|Error [0-9]|No such file|cannot find|undefined reference' "$f" | tail -15 || true
          done

      - name: Upload artifacts (any run)
        uses: actions/upload-artifact@v4
        with:
          name: teleproxy-keenetic
          path: |
            dist/teleproxy.*
            dist/teleproxy-keenetic_*.ipk
            dist/config.toml
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Teleproxy.Keenetic ${{ github.ref_name }}
          body_path: release-notes-${{ github.ref_name }}.md
          files: |
            dist/teleproxy.*
            dist/teleproxy-keenetic_*.ipk
            dist/config.toml
            dist/SHA256SUMS
