name: build-and-release

# Сборка под все архитектуры Keenetic и публикация релиза по тегу v*.
# Ручной запуск (workflow_dispatch) собирает и выкладывает артефакты в run,
# релиз создаётся только на тег.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cross toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl perl ca-certificates \
            gcc-mipsel-linux-gnu gcc-mips-linux-gnu \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf

      - name: Build (all arches)
        run: bash tools/build-arch.sh all

      - name: Package .ipk
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [ -z "$VER" ] || [ "$VER" = "$GITHUB_REF_NAME" ]; then VER="1.0"; fi
          cp packaging/config.toml.example dist/config.toml
          sh packaging/make-ipk.sh --version "$VER"

      - name: Checksums
        run: |
          cd dist
          sha256sum ./teleproxy.* ./teleproxy-keenetic_*.ipk > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts (any run)
        uses: actions/upload-artifact@v4
        with:
          name: teleproxy-keenetic
          path: |
            dist/teleproxy.*
            dist/teleproxy-keenetic_*.ipk
            dist/config.toml
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Teleproxy.Keenetic ${{ github.ref_name }}
          body_path: release-notes-v1.0.md
          files: |
            dist/teleproxy.*
            dist/teleproxy-keenetic_*.ipk
            dist/config.toml
            dist/SHA256SUMS
